version: "2"

linters:
  enable:
    - errcheck # an ignored error return is a silent failure
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    errcheck:
      # Writing to the console, cleaning up a temporary file on an error path,
      # or handing a handle back: none of these has anything to tell the caller.
      # Excluding them keeps the linter credible — one that only reports correct
      # code is one nobody reads.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
        - golang.org/x/sys/windows.CloseHandle

  exclusions:
    rules:
      # In a test, a close that fails changes neither the verdict nor what can
      # be done about it. Everywhere else each case is handled explicitly.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
