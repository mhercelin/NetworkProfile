name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet et tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatage
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Host "Fichiers non formatés :`n$unformatted"
            exit 1
          }

      - run: go vet ./...

      # Construit depuis les sources plutôt que via l'action officielle : la
      # version est alors épinglée par une seule ligne, lisible ici.
      - name: Analyse statique
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run ./...

      - name: Vulnérabilités connues
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Les tests marqués `integration` reconfigurent de vraies cartes réseau :
      # ils restent hors CI et se lancent à la main avant une release.
      - run: go test ./... -count=1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tests frontend
        working-directory: frontend
        run: |
          npm ci
          npm test

  build:
    name: Build applicatif
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer la CLI Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Compiler
        run: wails build -clean -skipbindings

      - uses: actions/upload-artifact@v4
        with:
          name: NetworkProfile-non-signe
          path: build/bin/NetworkProfile.exe
          retention-days: 7
