name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # `stable` rather than `go-version-file`: the `go` directive in go.mod is
      # a minimum language version, not a toolchain choice. Taking it literally
      # installs an unpatched release, and govulncheck then reports the
      # standard library's own advisories.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Host "Unformatted files:`n$unformatted"
            exit 1
          }

      - run: go vet ./...

      # Built from source rather than through the official action: the version
      # is then pinned by a single line, readable right here.
      - name: Static analysis
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run ./...

      - name: Known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # The `integration` tests reconfigure real network adapters: they stay out
      # of CI and are run by hand before a release.
      - run: go test ./... -count=1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

  build:
    name: Application build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # See the note above: `stable`, not the go.mod directive.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # Never -skipbindings: the JS bindings are generated and kept out of the
      # repository, and the frontend does not compile without them.
      - name: Build
        run: wails build -clean

      - uses: actions/upload-artifact@v4
        with:
          name: NetworkProfile-unsigned
          path: build/bin/NetworkProfile.exe
          retention-days: 7
