name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The version is written in three places: the tag, wails.json (which puts
      # it in the binary's resources) and the sidebar footer. Letting them drift
      # would produce a release whose binary announces a different version than
      # its own name.
      - name: Check the versions agree
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $wails = (Get-Content wails.json -Raw | ConvertFrom-Json).info.productVersion
          $ui = (Select-String -Path frontend/src/main.js -Pattern 'v(\d+\.\d+\.\d+)').Matches[0].Groups[1].Value

          "tag       : $tag"
          "wails.json: $wails"
          "interface : $ui"

          if ($tag -ne $wails -or $tag -ne $ui) {
            Write-Host "::error::Versions disagree. Align wails.json and frontend/src/main.js with the tag before releasing."
            exit 1
          }

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # Never -skipbindings: the JS bindings are generated and kept out of the
      # repository, and the frontend does not compile without them.
      - name: Build
        run: wails build -clean

      # Should this project ever get a certificate, signing slots in here:
      # between the build and the checksums, so the published hashes describe
      # the signed file rather than the one before it.

      - name: Compute checksums
        shell: pwsh
        working-directory: build/bin
        run: |
          Get-FileHash NetworkProfile.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content checksums.txt -Encoding ascii
          Get-Content checksums.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/NetworkProfile.exe
            build/bin/checksums.txt
          # Appended under the text below: the commits since the previous tag,
          # so a release says what changed without a changelog to keep in step.
          generate_release_notes: true
          body: |
            ## Installation

            Download `NetworkProfile.exe` and run it: there is nothing to
            install. Profiles are stored in `%AppData%\NetworkProfile`.

            Check the downloaded file against `checksums.txt`:

            ```powershell
            Get-FileHash NetworkProfile.exe -Algorithm SHA256
            ```

            The interface is in French.

            ## Administrator rights

            The application opens without asking for anything. Administrator
            credentials are requested at the first configuration change, and
            only once for as long as it stays open — closing the window leaves
            it in the notification area.

            ## This binary is not signed

            There is no code signing certificate behind this project, so
            Windows will warn that the publisher is unknown. Check the file
            against `checksums.txt`, or build it yourself from source — a
            binary you compiled locally raises no warning at all.

            To run the downloaded file anyway: *More info* → *Run anyway*, or
            `Unblock-File .\NetworkProfile.exe`.

            ## Privacy

            This program will not transfer any information to other networked
            systems unless specifically requested by the user or the person
            installing or operating it. No telemetry, no update check, no
            third-party service.
            [Full statement](https://github.com/mhercelin/NetworkProfile/blob/main/PRIVACY.md).
