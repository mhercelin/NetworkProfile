name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Compiler et publier
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # La version est écrite à trois endroits : le tag, wails.json (qui la met
      # dans les ressources du binaire) et le pied de la barre latérale. Les
      # laisser diverger produirait une release dont le binaire annonce une
      # autre version que son nom.
      - name: Vérifier la cohérence des versions
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $wails = (Get-Content wails.json -Raw | ConvertFrom-Json).info.productVersion
          $ihm = (Select-String -Path frontend/src/main.js -Pattern 'v(\d+\.\d+\.\d+)').Matches[0].Groups[1].Value

          "tag       : $tag"
          "wails.json: $wails"
          "interface : $ihm"

          if ($tag -ne $wails -or $tag -ne $ihm) {
            Write-Host "::error::Les versions divergent. Alignez wails.json et frontend/src/main.js sur le tag avant de publier."
            exit 1
          }

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer la CLI Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # Surtout pas -skipbindings : les liaisons JS sont générées et absentes
      # du dépôt, et le frontend ne compile pas sans elles.
      - name: Compiler
        run: wails build -clean

      # C'est ici que la signature SignPath viendra s'insérer, entre la
      # compilation et le calcul des empreintes : elle signe à distance, il n'y
      # a donc aucun certificat à déposer sur le runner.

      - name: Calculer les empreintes
        shell: pwsh
        working-directory: build/bin
        run: |
          Get-FileHash NetworkProfile.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content checksums.txt -Encoding ascii
          Get-Content checksums.txt

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/NetworkProfile.exe
            build/bin/checksums.txt
          body: |
            ## Installation

            Téléchargez `NetworkProfile.exe` et lancez-le : il n'y a rien à
            installer. Les profils sont enregistrés dans
            `%AppData%\NetworkProfile`.

            Vérifiez l'empreinte du fichier téléchargé :

            ```powershell
            Get-FileHash NetworkProfile.exe -Algorithm SHA256
            ```

            et comparez-la à `checksums.txt`.

            ## Droits administrateur

            L'application s'ouvre sans rien demander. Les identifiants
            administrateur ne sont demandés qu'au premier changement de
            configuration, et une seule fois tant qu'elle reste ouverte —
            fermer la fenêtre la laisse dans la zone de notification.

            ## Code signing policy

            Free code signing provided by [SignPath.io](https://signpath.io),
            certificate by [SignPath Foundation](https://signpath.org).

            Rôles et déclaration de confidentialité :
            [CODE-SIGNING-POLICY.md](https://github.com/mhercelin/NetworkProfile/blob/main/CODE-SIGNING-POLICY.md).

            This program will not transfer any information to other networked
            systems unless specifically requested by the user or the person
            installing or operating it.
